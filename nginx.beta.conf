map $http_x_forwarded_proto $finops_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream finops_api {
  zone finops_api 64k;
  server api:3000 resolve;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Only Traefik's current Dokploy address may supply client forwarding data.
  set_real_ip_from 10.0.1.17;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location ^~ /api/v1 {
    proxy_pass http://finops_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_set_header X-Forwarded-Proto $finops_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 125s;
    proxy_send_timeout 125s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok\n';
  }
}
